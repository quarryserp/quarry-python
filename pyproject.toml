[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quarryserp"
version = "0.1.0"
description = "Official Python SDK for the Quarry Google search results API"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "Quarry"}]
dependencies = ["httpx>=0.25,<1"]
keywords = ["quarry", "google", "search", "serp", "api", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://quarryserp.com"
Documentation = "https://quarryserp.com/docs/python-http"
Source = "https://github.com/quarryserp/quarry-python"

[tool.mypy]
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1", "mypy>=1.13,<2"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml", "CHANGELOG.md"]
